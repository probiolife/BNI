    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 配置 Webhook URL - 請替換為您的實際 Webhook URL
            const WEBHOOK_URL = 'https://your-webhook-url.com/survey-results';
            
            // 為選項添加點擊效果
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.addEventListener('click', function() {
                    if (this.querySelector('input[type="radio"]')) {
                        // 單選：移除同組其他選項的選中狀態
                        const name = this.querySelector('input').name;
                        document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
                            input.closest('.option').classList.remove('selected');
                        });
                        this.classList.add('selected');
                    } else if (this.querySelector('input[type="checkbox"]')) {
                        // 複選：切換選中狀態
                        this.classList.toggle('selected');
                    }
                });
            });

            // 監聽輸入變化
            document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
                input.addEventListener('change', function() {
                    if (this.type === 'radio') {
                        // 單選：更新視覺狀態
                        document.querySelectorAll(`input[name="${this.name}"]`).forEach(radio => {
                            radio.closest('.option').classList.remove('selected');
                        });
                        this.closest('.option').classList.add('selected');
                    } else if (this.type === 'checkbox') {
                        // 複選：切換視覺狀態
                        this.closest('.option').classList.toggle('selected', this.checked);
                    }
                });
            });

            // 表單提交處理
            document.getElementById('healthSurvey').addEventListener('submit', function(e) {
                e.preventDefault();
                
                let totalScore = 0;
                const formData = new FormData(this);
                
                // 計算總分
                for (let [name, value] of formData.entries()) {
                    if (name !== 'health_interest' && name !== 'additional_comments') {
                        totalScore += parseInt(value) || 0;
                    }
                }

                // 收集健康資訊興趣
                const healthInterests = [];
                document.querySelectorAll('input[name="health_interest"]:checked').forEach(checkbox => {
                    const labels = {
                        'sleep': '睡眠改善',
                        'mood': '心情管理',
                        'digestive': '腸胃健康',
                        'skincare': '皮膚保養',
                        'exercise': '運動健身'
                    };
                    healthInterests.push(labels[checkbox.value]);
                });

                // 顯示結果並發送 Webhook
                displayResult(totalScore, healthInterests, formData.get('additional_comments'));
                sendWebhook(formData, totalScore, healthInterests);
            });
        });

        // 發送 Webhook 函數
        async function sendWebhook(formData, totalScore, healthInterests) {
            const WEBHOOK_URL = 'https://your-webhook-url.com/survey-results';
            
            // 準備發送的數據 - 扁平化結構，便於表格顯示
            const surveyData = {
                timestamp: new Date().toISOString(),
                q1_age: getResponseText('age', formData.get('age')),
                q2_gender: getResponseText('gender', formData.get('gender')),
                q3_shift: getResponseText('shift_work', formData.get('shift_work')),
                q4_sleep: getResponseText('sleep_quality', formData.get('sleep_quality')),
                q5_hours: getResponseText('sleep_hours', formData.get('sleep_hours')),
                q6_fatigue: getResponseText('fatigue', formData.get('fatigue')),
                q7_gut: getResponseText('stomach_discomfort', formData.get('stomach_discomfort')),
                q8_bowel: getResponseText('eating_out', formData.get('eating_out')),
                q9_bloat: getResponseText('alcohol', formData.get('alcohol')),
                q10_emotion: getResponseText('bowel_problems', formData.get('bowel_problems')),
                q11_skin: getResponseText('bloating_reflux', formData.get('bloating_reflux')),
                q12_ex_freq: getResponseText('mood_issues', formData.get('mood_issues')),
                q13_ex_dur: getResponseText('skin_aging', formData.get('skin_aging')),
                q14_interest: getResponseText('exercise_frequency', formData.get('exercise_frequency')),
                q15_interest: getResponseText('exercise_duration', formData.get('exercise_duration')),
                q16_interest: healthInterests.join(', '),
                comments: formData.get('additional_comments') || '',
                score: totalScore,
                suggestion: getSuggestionCategory(totalScore)
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(surveyData)
                });

                const webhookStatus = document.getElementById('webhookStatus');
                
                if (response.ok) {
                    webhookStatus.textContent = '✅ 問卷結果已成功提交';
                    webhookStatus.classList.remove('webhook-error');
                } else {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                webhookStatus.style.display = 'block';
                
            } catch (error) {
                console.error('Webhook 發送失敗:', error);
                const webhookStatus = document.getElementById('webhookStatus');
                webhookStatus.textContent = '⚠️ 資料提交失敗，請稍後重試';
                webhookStatus.classList.add('webhook-error');
                webhookStatus.style.display = 'block';
            }
        }

        // 將選項值轉換為中文回應文字
        function getResponseText(questionName, value) {
            const responseMap = {
                'age': {
                    '4': '小於20歲' // 所有年齡選項都是4分，可以根據實際選項調整
                },
                'gender': {
                    '0': '男/女' // 性別選項都是0分
                },
                'shift_work': {

        // 根據分數獲取建議類別
        function getSuggestionCategory(score) {
            if (score >= 50) {
                return '健康狀況優良';
            } else if (score >= 35) {
                return '需注意改善';
            } else {
                return '需積極改善';
            }
        }

        // 重新開始函數
        function startOver() {
            // 重置表單
            document.getElementById('healthSurvey').reset();
            
            // 移除所有選中狀態
            document.querySelectorAll('.option.selected').forEach(option => {
                option.classList.remove('selected');
            });
            
            // 隱藏結果
            document.getElementById('result').style.display = 'none';
            
            // 滾動到頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function displayResult(score, interests, comments) {
            const resultDiv = document.getElementById('result');
            const scoreDiv = document.getElementById('totalScore');
            const interpretationDiv = document.getElementById('interpretation');

            scoreDiv.textContent = `總分：${score} 分`;

            let interpretation = '';
            let recommendations = [];

            if (score >= 50) {
                interpretation = `
                    <h4 style="color: #4CAF50;">🎉 健康狀況優良</h4>
                    <p>恭喜您！您的整體健康狀況非常良好。請繼續保持現有的健康生活方式。</p>
                `;
                ;
            } else if (score >= 35) {
                interpretation = `
                    <h4 style="color: #ff9800;">⚠️ 健康狀況良好但需注意</h4>
                    <p>您的健康狀況大致良好，但在某些方面需要多加注意和改善。</p>
                    <p style="background: #fff3cd; padding: 10px; border-radius: 5px; margin: 10px 0;">
                        🌟 <strong>專業營養師諮詢：</strong>如需專業健康建議，歡迎聯繫營養博士 Susana Lauw 獲得個人化的營養指導。
                    </p>
                `;
                ;
            } else {
                interpretation = `
                    <h4 style="color: #f44336;">🚨 健康狀況需要改善</h4>
                    <p>您的健康狀況需要積極改善，建議諮詢專業醫療人員並調整生活方式。</p>
                    <p style="background: #f8d7da; padding: 10px; border-radius: 5px; margin: 10px 0;">
                        🌟 <strong>專業營養師諮詢：</strong>如需專業健康建議，歡迎聯繫營養博士 Susana Lauw 獲得個人化的營養指導。
                    </p>
                `;
              
            }

            let interestSection = '';
            if (interests.length > 0) {
                interestSection = `
                    <h4 style="margin-top: 20px;">您感興趣的健康資訊：</h4>
                    <ul style="margin: 10px 0; padding-left: 20px;">
                        ${interests.map(interest => `<li>${interest}</li>`).join('')}
                    </ul>
                `;
            }

            let commentsSection = '';
            if (comments && comments.trim()) {
                commentsSection = `
                    <h4 style="margin-top: 20px;">您的補充意見：</h4>
                    <p style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 10px 0;">${comments}</p>
                `;
            }

            interpretationDiv.innerHTML = `
                ${interpretation}
                </ul>
                ${interestSection}
                ${commentsSection}
                <div style="margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px;">
                    <strong>注意：</strong>此調查僅供參考，不能替代專業醫療診斷。如有健康疑慮，請諮詢合格的醫療專業人員。
                </div>
            `;

            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
