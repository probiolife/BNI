<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNI ACTION健康調查問卷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微軟正黑體', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px 30px;
        }

        .question-group {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #4CAF50;
            transition: all 0.3s ease;
        }

        .question-group:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .question-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .question-number {
            background: #4CAF50;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            border-color: #4CAF50;
            background: #f8fff8;
        }

        .option input[type="radio"], .option input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.2);
            accent-color: #4CAF50;
        }

        .option.selected {
            border-color: #4CAF50;
            background: #e8f5e8;
        }

        .text-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .number-input {
            width: 100px;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            text-align: center;
        }

        .submit-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto 0;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .result {
            background: #e8f5e8;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
            display: none;
        }

        .result h3 {
            color: #2c5530;
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .score {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin: 15px 0;
        }

        .interpretation {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .start-over-btn {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 15px auto 0;
            display: block;
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.3);
        }

        .start-over-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 117, 125, 0.4);
        }

        .webhook-status {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }

        .webhook-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .form-container {
                padding: 25px 20px;
            }
            
            .question-group {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BNI ACTION健康調查問卷</h1>
            <p>請完成以下問卷，了解您的健康狀況</p>
        </div>

        <div class="form-container">
            <form id="healthSurvey">
                <!-- 原有問題開始 -->
                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">1</div>
                        您的年齡
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="age" value="4">
                            小於20歲
                        </label>
                        <label class="option">
                            <input type="radio" name="age" value="4">
                            20-29歲
                        </label>
                        <label class="option">
                            <input type="radio" name="age" value="4">
                            30-39歲
                        </label>
                        <label class="option">
                            <input type="radio" name="age" value="4">
                            40-49歲
                        </label>
                        <label class="option">
                            <input type="radio" name="age" value="4">
                            50歲以上
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">2</div>
                        您的性別
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="gender" value="0">
                            男
                        </label>
                        <label class="option">
                            <input type="radio" name="gender" value="0">
                            女
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">3</div>
                        您是否有輪班或夜班工作？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="shift_work" value="1">
                            有
                        </label>
                        <label class="option">
                            <input type="radio" name="shift_work" value="4">
                            無
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">4</div>
                        睡眠情況如何？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="sleep_quality" value="4">
                            非常好
                        </label>
                        <label class="option">
                            <input type="radio" name="sleep_quality" value="3">
                            還可
                        </label>
                        <label class="option">
                            <input type="radio" name="sleep_quality" value="2">
                            有時好有時不好
                        </label>
                        <label class="option">
                            <input type="radio" name="sleep_quality" value="1">
                            很難睡
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">5</div>
                        您平均每天睡眠幾小時？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="sleep_hours" value="1">
                            少於5小時
                        </label>
                        <label class="option">
                            <input type="radio" name="sleep_hours" value="2">
                            5-6小時
                        </label>
                        <label class="option">
                            <input type="radio" name="sleep_hours" value="4">
                            7-8小時
                        </label>
                        <label class="option">
                            <input type="radio" name="sleep_hours" value="2">
                            9小時以上
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">6</div>
                        是否常感到疲勞？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="fatigue" value="4">
                            幾乎沒有
                        </label>
                        <label class="option">
                            <input type="radio" name="fatigue" value="3">
                            偶爾
                        </label>
                        <label class="option">
                            <input type="radio" name="fatigue" value="2">
                            比較常見
                        </label>
                        <label class="option">
                            <input type="radio" name="fatigue" value="1">
                            常常如此
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">7</div>
                        有無腸胃不適？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="stomach_discomfort" value="4">
                            沒有
                        </label>
                        <label class="option">
                            <input type="radio" name="stomach_discomfort" value="2">
                            偶爾
                        </label>
                        <label class="option">
                            <input type="radio" name="stomach_discomfort" value="1">
                            常常
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">8</div>
                        您一週有幾天在外用餐？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="eating_out" value="4">
                            0-1天
                        </label>
                        <label class="option">
                            <input type="radio" name="eating_out" value="3">
                            2-3天
                        </label>
                        <label class="option">
                            <input type="radio" name="eating_out" value="2">
                            4-5天
                        </label>
                        <label class="option">
                            <input type="radio" name="eating_out" value="1">
                            6-7天
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">9</div>
                        您一週飲用多少杯酒類（含啤酒、紅酒、烈酒等）？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="alcohol" value="4">
                            0杯
                        </label>
                        <label class="option">
                            <input type="radio" name="alcohol" value="3">
                            1-3杯
                        </label>
                        <label class="option">
                            <input type="radio" name="alcohol" value="2">
                            4-7杯
                        </label>
                        <label class="option">
                            <input type="radio" name="alcohol" value="1">
                            8杯以上
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">10</div>
                        有無排便異常？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="bowel_problems" value="4">
                            沒有
                        </label>
                        <label class="option">
                            <input type="radio" name="bowel_problems" value="2">
                            偶爾
                        </label>
                        <label class="option">
                            <input type="radio" name="bowel_problems" value="1">
                            常常
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">11</div>
                        有無腹脹、胃酸倒流？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="bloating_reflux" value="4">
                            沒有
                        </label>
                        <label class="option">
                            <input type="radio" name="bloating_reflux" value="2">
                            偶爾
                        </label>
                        <label class="option">
                            <input type="radio" name="bloating_reflux" value="1">
                            常常
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">12</div>
                        有無情緒低落、緊張煩躁？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="mood_issues" value="4">
                            沒有
                        </label>
                        <label class="option">
                            <input type="radio" name="mood_issues" value="2">
                            偶爾
                        </label>
                        <label class="option">
                            <input type="radio" name="mood_issues" value="1">
                            常常
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">13</div>
                        肌膚有鬆弛、暗啞、皺紋等老化現象？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="skin_aging" value="4">
                            沒有
                        </label>
                        <label class="option">
                            <input type="radio" name="skin_aging" value="2">
                            有一點
                        </label>
                        <label class="option">
                            <input type="radio" name="skin_aging" value="1">
                            很多
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">14</div>
                        每週運動幾次？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="exercise_frequency" value="1">
                            沒有
                        </label>
                        <label class="option">
                            <input type="radio" name="exercise_frequency" value="2">
                            1-2次
                        </label>
                        <label class="option">
                            <input type="radio" name="exercise_frequency" value="4">
                            3次以上
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">15</div>
                        每次運動時間？
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="radio" name="exercise_duration" value="1">
                            少於15分鐘
                        </label>
                        <label class="option">
                            <input type="radio" name="exercise_duration" value="2">
                            15-30分鐘
                        </label>
                        <label class="option">
                            <input type="radio" name="exercise_duration" value="4">
                            30分鐘以上
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">16</div>
                        想了解哪些健康資訊（可複選）
                    </div>
                    <div class="options">
                        <label class="option">
                            <input type="checkbox" name="health_interest" value="sleep">
                            睡眠改善
                        </label>
                        <label class="option">
                            <input type="checkbox" name="health_interest" value="mood">
                            心情管理
                        </label>
                        <label class="option">
                            <input type="checkbox" name="health_interest" value="digestive">
                            腸胃健康
                        </label>
                        <label class="option">
                            <input type="checkbox" name="health_interest" value="skincare">
                            皮膚保養
                        </label>
                        <label class="option">
                            <input type="checkbox" name="health_interest" value="exercise">
                            運動健身
                        </label>
                    </div>
                </div>

                <div class="question-group">
                    <div class="question-title">
                        <div class="question-number">17</div>
                        其他補充
                    </div>
                    <textarea class="text-input" name="additional_comments" placeholder="請輸入您的補充意見或建議..." rows="4"></textarea>
                </div>

                <button type="submit" class="submit-btn">提交問卷</button>
            </form>

            <div id="result" class="result">
                <h3>您的健康評估結果</h3>
                <div class="score" id="totalScore"></div>
                <div class="interpretation" id="interpretation"></div>
                <div id="webhookStatus" class="webhook-status"></div>
                <button type="button" class="start-over-btn" onclick="startOver()">重新開始</button>
            </div>
        </div>
    </div>

       <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 為選項添加點擊效果
            const options = document.querySelectorAll('.option');
            options.forEach(option => {
                option.addEventListener('click', function() {
                    if (this.querySelector('input[type="radio"]')) {
                        const name = this.querySelector('input').name;
                        document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
                            input.closest('.option').classList.remove('selected');
                        });
                        this.classList.add('selected');
                    } else if (this.querySelector('input[type="checkbox"]')) {
                        this.classList.toggle('selected');
                    }
                });
            });

            // 監聽輸入變化
            document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
                input.addEventListener('change', function() {
                    if (this.type === 'radio') {
                        document.querySelectorAll(`input[name="${this.name}"]`).forEach(radio => {
                            radio.closest('.option').classList.remove('selected');
                        });
                        this.closest('.option').classList.add('selected');
                    } else if (this.type === 'checkbox') {
                        this.closest('.option').classList.toggle('selected', this.checked);
                    }
                });
            });

            // 表單提交處理
            document.getElementById('healthSurvey').addEventListener('submit', function(e) {
                e.preventDefault();
                
                let totalScore = 0;
                const formData = new FormData(this);
                
                // 計算總分
                for (let [name, value] of formData.entries()) {
                    if (name !== 'health_interest' && name !== 'additional_comments') {
                        totalScore += parseInt(value) || 0;
                    }
                }

                // 收集健康資訊興趣
                const healthInterests = [];
                document.querySelectorAll('input[name="health_interest"]:checked').forEach(checkbox => {
                    const labels = {
                        'sleep': '睡眠改善', 'mood': '心情管理', 'digestive': '腸胃健康',
                        'skincare': '皮膚保養', 'exercise': '運動健身'
                    };
                    healthInterests.push(labels[checkbox.value]);
                });
                
                const comments = formData.get('additional_comments');

                // 顯示結果並發送 Webhook
                displayResult(totalScore, healthInterests, comments);
                sendWebhook(totalScore, healthInterests, comments);
            });
        });

        // --- START OF FULLY CORRECTED AND SIMPLIFIED CODE ---
        function sendWebhook(totalScore, healthInterests, comments) {
            // This helper function is the most reliable way to get the answer.
            // It finds the selected radio button and gets the text from its parent label.
            const getSelectedRadioLabel = (name) => {
                const selectedRadio = document.querySelector(`input[name="${name}"]:checked`);
                if (selectedRadio) {
                    // .parentElement.textContent gets the text of the <label>
                    return selectedRadio.parentElement.textContent.trim();
                }
                return ''; // Return empty string if nothing is selected
            };

            // We now use getSelectedRadioLabel for ALL radio button questions to ensure accuracy.
            const fullData = {
                timestamp: new Date().toISOString(),
                q1_age: getSelectedRadioLabel('age'),
                q2_gender: getSelectedRadioLabel('gender'),
                q3_shift: getSelectedRadioLabel('shift_work'),
                q4_sleep: getSelectedRadioLabel('sleep_quality'),
                q5_hours: getSelectedRadioLabel('sleep_hours'),
                q6_fatigue: getSelectedRadioLabel('fatigue'),
                q7_gut: getSelectedRadioLabel('stomach_discomfort'),
                q8_eating_out: getSelectedRadioLabel('eating_out'),
                q9_alcohol: getSelectedRadioLabel('alcohol'),
                q10_bowel: getSelectedRadioLabel('bowel_problems'),
                q11_bloat: getSelectedRadioLabel('bloating_reflux'),
                q12_emotion: getSelectedRadioLabel('mood_issues'),
                q13_skin: getSelectedRadioLabel('skin_aging'),
                q14_ex_freq: getSelectedRadioLabel('exercise_frequency'),
                q15_ex_dur: getSelectedRadioLabel('exercise_duration'),
                q16_interest: healthInterests.join(', '),
                comments: comments || '',
                score: totalScore,
                suggestion: getSuggestionCategory(totalScore)
            };

            fetch("https://hook.us2.make.com/7mi689vx8um626hxooko9etli5dj2vk7", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(fullData)
            })
            .then(response => {
                if (response.ok) {
                    console.log("✅ Webhook sent successfully");
                } else {
                    console.error("❌ Webhook failed with status:", response.status);
                }
            })
            .catch(err => console.error("❌ Webhook network error:", err));
        }
        // --- END OF FULLY CORRECTED CODE ---

        function getSuggestionCategory(score) {
            if (score >= 50) {
                return '健康狀況優良';
            } else if (score >= 35) {
                return '需注意改善';
            } else {
                return '需積極改善';
            }
        }

        function startOver() {
            document.getElementById('healthSurvey').reset();
            document.querySelectorAll('.option.selected').forEach(option => {
                option.classList.remove('selected');
            });
            document.getElementById('result').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function displayResult(score, interests, comments) {
            const resultDiv = document.getElementById('result');
            const scoreDiv = document.getElementById('totalScore');
            const interpretationDiv = document.getElementById('interpretation');

            scoreDiv.textContent = `總分：${score} 分`;

            let interpretation = '';
            if (score >= 50) {
                interpretation = `<h4 style="color: #4CAF50;">🎉 健康狀況優良</h4><p>恭喜您！您的整體健康狀況非常良好。請繼續保持現有的健康生活方式。</p>`;
            } else if (score >= 35) {
                interpretation = `<h4 style="color: #ff9800;">⚠️ 健康狀況良好但需注意</h4><p>您的健康狀況大致良好，但在某些方面需要多加注意和改善。</p><p style="background: #fff3cd; padding: 10px; border-radius: 5px; margin: 10px 0;">🌟<strong><strong>歡迎聯絡🍅🥝</strong>營養學博士Dr. Susana 1-2-1 Dance 業務探訪🥰🥰</p>`;
            } else {
                interpretation = `<h4 style="color: #f44336;">🚨 健康狀況需要改善</h4><p>您的健康狀況需要積極改善，建議諮詢專業醫療人員並調整生活方式。</p><p style="background: #f8d7da; padding: 10px; border-radius: 5px; margin: 10px 0;">🌟<strong>歡迎聯絡🍅🥝</strong>營養學博士Dr. Susana 1-2-1 Dance 業務探訪🥰🥰</p>`;
            }

            let interestSection = '';
            if (interests.length > 0) {
                interestSection = `<h4 style="margin-top: 20px;">您感興趣的健康資訊：</h4><ul style="margin: 10px 0; padding-left: 20px;">${interests.map(interest => `<li>${interest}</li>`).join('')}</ul>`;
            }

            let commentsSection = '';
            if (comments && comments.trim()) {
                commentsSection = `<h4 style="margin-top: 20px;">您的補充意見：</h4><p style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 10px 0;">${comments}</p>`;
            }

            interpretationDiv.innerHTML = `${interpretation}${interestSection}${commentsSection}<div style="margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px;"><strong>注意：</strong>此調查僅供參考，不能替代專業醫療診斷。</div>`;

            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
